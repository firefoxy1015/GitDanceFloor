<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AION 2 次元進攻提醒器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1d4a 100%);
    color: #e8e8ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.8em;
    margin: 20px 0 8px;
    color: #7df9ff;
    text-shadow: 0 0 12px rgba(125,249,255,0.5);
  }
  .subtitle { color: #aab; margin-bottom: 24px; font-size: 0.9em; }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(125,249,255,0.2);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
    backdrop-filter: blur(8px);
  }

  .next-time {
    text-align: center;
    font-size: 0.85em;
    color: #aab;
  }
  .countdown {
    text-align: center;
    font-size: 3.2em;
    font-weight: bold;
    color: #ffd86b;
    margin: 12px 0;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(255,216,107,0.4);
  }
  .spawn-info {
    text-align: center;
    font-size: 1.1em;
    color: #7df9ff;
  }

  .controls { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row label { color: #ccd; font-size: 0.95em; }
  input[type="number"] {
    width: 70px;
    padding: 6px 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(125,249,255,0.3);
    color: #fff;
    border-radius: 6px;
    font-size: 1em;
    text-align: center;
  }
  input[type="checkbox"] { transform: scale(1.3); accent-color: #7df9ff; }

  button {
    width: 100%;
    padding: 14px;
    font-size: 1.1em;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-start { background: #7df9ff; color: #0a0e27; }
  .btn-start:hover { background: #b0fbff; transform: translateY(-1px); }
  .btn-stop { background: #ff6b6b; color: #fff; }
  .btn-test { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .btn-test:hover { background: rgba(255,255,255,0.2); }

  .status {
    text-align: center;
    padding: 8px;
    border-radius: 6px;
    font-size: 0.9em;
    margin-top: 8px;
  }
  .status.on { background: rgba(125,249,255,0.15); color: #7df9ff; }
  .status.off { background: rgba(255,107,107,0.15); color: #ff6b6b; }

  .alert-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,0,0,0.85);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
    animation: pulse 0.6s infinite alternate;
  }
  .alert-overlay.show { display: flex; }
  .alert-overlay h2 {
    font-size: 3em;
    color: #fff;
    text-shadow: 0 0 20px #000;
    margin: 0;
  }
  .alert-overlay p {
    font-size: 1.5em;
    color: #ffd86b;
    margin: 16px 0;
  }
  .alert-overlay button {
    width: auto;
    padding: 12px 32px;
    margin-top: 24px;
    background: #fff;
    color: #c00;
  }
  @keyframes pulse {
    from { background: rgba(255,0,0,0.85); }
    to { background: rgba(180,0,0,0.95); }
  }

  .footer { color: #667; font-size: 0.8em; margin-top: 16px; text-align: center; }
  .log {
    font-size: 0.8em;
    color: #99a;
    max-height: 100px;
    overflow-y: auto;
    text-align: left;
  }
</style>
</head>
<body>
  <h1>⚔ AION 2 次元進攻提醒器</h1>
  <div class="subtitle">每小時 XX:30 開始 · 提前提醒</div>

  <div class="card">
    <div class="next-time">下次刷新</div>
    <div class="countdown" id="countdown">--:--</div>
    <div class="spawn-info" id="spawnInfo">尚未啟動</div>
  </div>

  <div class="card controls">
    <div class="row">
      <label>提前幾分鐘提醒</label>
      <input type="number" id="leadMin" value="2" min="0" max="29">
    </div>
    <div class="row">
      <label>刷新分鐘 (XX:?)</label>
      <input type="number" id="spawnMin" value="30" min="0" max="59">
    </div>
    <div class="row">
      <label>只在 (時) ~ (時) 提醒</label>
      <div>
        <input type="number" id="startHour" value="9" min="0" max="23">
        ~
        <input type="number" id="endHour" value="23" min="0" max="23">
      </div>
    </div>
    <div class="row">
      <label>桌面通知</label>
      <input type="checkbox" id="useNotify" checked>
    </div>
    <div class="row">
      <label>音效</label>
      <input type="checkbox" id="useSound" checked>
    </div>

    <button id="toggleBtn" class="btn-start">啟動提醒</button>
    <button id="testBtn" class="btn-test">測試提醒效果</button>
    <div class="status off" id="status">已停止</div>
  </div>

  <div class="card">
    <div class="log" id="log"></div>
  </div>

  <div class="footer">資料來源：AION 2 4/8 改版（XX:00 → XX:30）</div>

  <div class="alert-overlay" id="alertOverlay">
    <h2>⚔ 次元進攻 ⚔</h2>
    <p id="alertText">即將開始！</p>
    <button onclick="dismissAlert()">收到</button>
  </div>

<script>
let timerId = null;
let countdownId = null;
let nextAlertMs = 0;
let nextSpawnMs = 0;
let audioCtx = null;
let alarmIntervalId = null;
let alarmStopAt = 0;

const $ = id => document.getElementById(id);

function log(msg) {
  const el = $("log");
  const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

function nextAlertTime(now, spawnMin, leadMin, startHour, endHour) {
  const alertMin = (spawnMin - leadMin + 60) % 60;
  for (let i = 0; i < 48; i++) {
    const cand = new Date(now);
    cand.setSeconds(0, 0);
    cand.setMinutes(alertMin);
    cand.setHours(cand.getHours() + Math.floor(i));
    if (alertMin >= now.getMinutes() && i === 0) {
      // same hour, future minute
    } else if (i === 0) {
      continue;
    }
    if (cand <= now) continue;

    const spawn = new Date(cand.getTime() + leadMin * 60000);
    const h = spawn.getHours();
    const ok = startHour <= endHour
      ? (h >= startHour && h <= endHour)
      : (h >= startHour || h <= endHour);
    if (ok) return { alertAt: cand, spawnAt: spawn };
  }
  return null;
}

function fmtTime(d) {
  return d.getHours().toString().padStart(2, "0") + ":" +
         d.getMinutes().toString().padStart(2, "0");
}

function fmtCountdown(ms) {
  if (ms < 0) ms = 0;
  const total = Math.floor(ms / 1000);
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
}

function tick() {
  const remain = nextAlertMs - Date.now();
  $("countdown").textContent = fmtCountdown(remain + ($("leadMin").valueAsNumber || 0) * 60000);

  if (remain <= 0) {
    fireAlert();
    setTimeout(scheduleNext, 60000);
  }
}

function scheduleNext() {
  const lead = $("leadMin").valueAsNumber || 0;
  const spawn = $("spawnMin").valueAsNumber || 30;
  const sh = $("startHour").valueAsNumber || 0;
  const eh = $("endHour").valueAsNumber || 23;

  const next = nextAlertTime(new Date(), spawn, lead, sh, eh);
  if (!next) {
    log("找不到下次提醒時間");
    return;
  }
  nextAlertMs = next.alertAt.getTime();
  nextSpawnMs = next.spawnAt.getTime();
  $("spawnInfo").textContent = `刷新時間 ${fmtTime(next.spawnAt)} · 提醒 ${fmtTime(next.alertAt)}`;
  log(`下次提醒：${fmtTime(next.alertAt)}（刷新 ${fmtTime(next.spawnAt)}）`);
}

function start() {
  if (timerId) return;

  if ($("useNotify").checked && "Notification" in window) {
    if (Notification.permission === "default") {
      Notification.requestPermission();
    }
  }

  scheduleNext();
  countdownId = setInterval(tick, 1000);
  timerId = true;

  $("toggleBtn").textContent = "停止提醒";
  $("toggleBtn").className = "btn-stop";
  $("status").textContent = "● 提醒已啟動";
  $("status").className = "status on";
  log("提醒已啟動");
}

function stop() {
  clearInterval(countdownId);
  countdownId = null;
  timerId = null;
  stopAlarm();
  $("toggleBtn").textContent = "啟動提醒";
  $("toggleBtn").className = "btn-start";
  $("status").textContent = "已停止";
  $("status").className = "status off";
  $("countdown").textContent = "--:--";
  $("spawnInfo").textContent = "尚未啟動";
  log("提醒已停止");
}

function fireAlert(testMode = false) {
  const lead = $("leadMin").valueAsNumber || 0;
  const spawnTime = testMode
    ? new Date(Date.now() + lead * 60000)
    : new Date(nextSpawnMs);

  $("alertText").textContent = `刷新時間 ${fmtTime(spawnTime)} · 還有 ${lead} 分鐘`;
  $("alertOverlay").classList.add("show");

  if ($("useSound").checked) playBeep();

  if ($("useNotify").checked && "Notification" in window
      && Notification.permission === "granted") {
    new Notification("⚔ AION 2 次元進攻", {
      body: `${fmtTime(spawnTime)} 開始（剩 ${lead} 分鐘）按 M 開地圖`,
      requireInteraction: true,
    });
  }

  document.title = "⚔ 次元進攻！ ⚔";
  setTimeout(() => { document.title = "AION 2 次元進攻提醒器"; }, 30000);
  log(`觸發提醒（刷新 ${fmtTime(spawnTime)}）`);
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    // 一個音調 = 振盪器 + 高增益（聲音大）
    const tone = (freq, start, dur, gain = 0.9) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = freq;
      o.type = "square"; // 方波比 sine 更響更刺耳
      g.gain.setValueAtTime(0, audioCtx.currentTime + start);
      g.gain.linearRampToValueAtTime(gain, audioCtx.currentTime + start + 0.02);
      g.gain.setValueAtTime(gain, audioCtx.currentTime + start + dur - 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(audioCtx.currentTime + start);
      o.stop(audioCtx.currentTime + start + dur);
    };

    // 一輪警報聲 ~ 1.6 秒
    const playOneCycle = () => {
      tone(1000, 0,    0.35);
      tone(1400, 0.4,  0.35);
      tone(1000, 0.8,  0.35);
      tone(1400, 1.2,  0.4);
    };

    playOneCycle();
    // 每 1.7 秒重播一次，總共最多響 30 秒（除非按收到）
    if (alarmIntervalId) clearInterval(alarmIntervalId);
    alarmStopAt = Date.now() + 30000;
    alarmIntervalId = setInterval(() => {
      if (Date.now() >= alarmStopAt) {
        stopAlarm();
        return;
      }
      playOneCycle();
    }, 1700);
  } catch (e) { log("音效播放失敗: " + e.message); }
}

function stopAlarm() {
  if (alarmIntervalId) {
    clearInterval(alarmIntervalId);
    alarmIntervalId = null;
  }
}

function dismissAlert() {
  $("alertOverlay").classList.remove("show");
  stopAlarm();
}

$("toggleBtn").addEventListener("click", () => {
  if (timerId) stop(); else start();
});
$("testBtn").addEventListener("click", () => fireAlert(true));
[$("leadMin"), $("spawnMin"), $("startHour"), $("endHour")].forEach(el => {
  el.addEventListener("change", () => { if (timerId) scheduleNext(); });
});

log("頁面已載入，按「啟動提醒」開始");
</script>
</body>
</html>
